<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集 Portfolio SPA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        /* 基礎與字體設定 */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F9F6F0;
            overflow-x: hidden;
        }
        h1, .serif-font {
            font-family: 'Noto Serif TC', serif;
        }

        /* 隱藏捲動軸，保持版面純淨 */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        /* SPA 頁面切換過渡動畫 */
        .view-container {
            transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
            width: 100%;
            min-height: 100vh;
        }
        .view-hidden {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            transform: translateY(20px);
            visibility: hidden;
        }
        .view-active {
            opacity: 1;
            pointer-events: auto;
            position: relative;
            z-index: 10;
            transform: translateY(0);
            visibility: visible;
        }

        /* 跑馬燈容器設定 (漸層遮罩) */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            display: flex;
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
            padding: 1rem 0;
        }
        .marquee-content {
            display: flex;
            width: max-content;
        }
        /* 滑鼠懸停時暫停 */
        .marquee-container:hover .marquee-content {
            animation-play-state: paused;
        }

        /* 跑馬燈方向與動畫 */
        .scroll-left { animation: scroll-left 40s linear infinite; }
        .scroll-right { animation: scroll-right 45s linear infinite; }
        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes scroll-right { 0% { transform: translateX(-50%); } 100% { transform: translateX(0); } }

        /* 首頁跑馬燈卡片樣式 */
        .portfolio-card {
            width: 420px;
            height: 280px;
            flex-shrink: 0;
            border-radius: 0.75rem;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            cursor: pointer;
        }
        .portfolio-card:hover {
            transform: scale(1.03);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }
        .portfolio-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
        }
        .portfolio-card:hover img {
            transform: scale(1.08); /* 內部微觀放大 */
        }

        /* 網格相片卡片樣式 */
        .photo-card {
            overflow: hidden;
            border-radius: 0.5rem;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            background-color: #eee;
        }
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .photo-card:hover img { transform: scale(1.08); }

        /* 牆面角度翻轉特效 (Wall Angle Flip 3D) */
        @keyframes wall-flip {
            0% { 
                opacity: 0; 
                transform: perspective(1200px) rotateY(-90deg) translateZ(-150px); 
            }
            100% { 
                opacity: 1; 
                transform: perspective(1200px) rotateY(0deg) translateZ(0); 
            }
        }
        .flip-anim {
            animation: wall-flip 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
            transform-origin: left center; 
            transform-style: preserve-3d;
        }

        /* Gallery 選單標籤樣式 */
        .tab-btn { position: relative; }
        .tab-btn::after {
            content: ''; position: absolute; bottom: -4px; left: 50%;
            transform: translateX(-50%); width: 0; height: 1px;
            background-color: #1f2937; transition: width 0.3s ease;
        }
        .tab-btn.active { color: #1f2937; font-weight: 600; }
        .tab-btn.active::after { width: 60%; }
    </style>
</head>
<body class="bg-gradient-to-b from-[#F9F6F0] via-[#FCFAF8] to-white min-h-screen text-gray-800 relative">

    <!-- 首頁視圖 (跑馬燈) -->
    <div id="home-view" class="view-container view-active flex flex-col justify-between pt-16">
        <!-- 頂部標題區 -->
        <header class="text-center px-4 mb-4">
            <h1 class="text-4xl md:text-5xl font-semibold tracking-[0.2em] text-gray-800 mb-3 ml-2">作品集</h1>
            <p class="text-sm md:text-base text-gray-500 font-light tracking-wider">PORTFOLIO & COLLECTION</p>
            <div class="w-12 h-[1px] bg-gray-400 mx-auto mt-6"></div>
        </header>

        <!-- 主體內容區 (跑馬燈) -->
        <main class="flex-grow flex flex-col justify-center gap-6 md:gap-10 overflow-visible py-4">
            
            <!-- 第一層 - 由右至左 -->
            <section class="marquee-container">
                <div class="marquee-content scroll-left">
                    <!-- 第一組相片 -->
                    <div class="flex gap-6 pr-6">
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/a6700/DSC01227.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/a6700/DSC00429.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/a6700/DSC01266.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/a6700/DSC00542.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/a6700/DSC00881.jpg?raw=true" alt="Img"></div>
                    </div>
                    <!-- 第二組相片 (複製以達到無縫循環) -->
                    <div class="flex gap-6 pr-6">
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/a6700/DSC01227.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/a6700/DSC00429.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/a6700/DSC01266.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/a6700/DSC00542.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/a6700/DSC00881.jpg?raw=true" alt="Img"></div>
                    </div>
                </div>
            </section>

            <!-- 第二層 - 由左至右 -->
            <section class="marquee-container">
                <div class="marquee-content scroll-right">
                    <!-- 第一組相片 -->
                    <div class="flex gap-6 pr-6">
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322232.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322384.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322328.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322542.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322590.jpg?raw=true" alt="Img"></div>
                    </div>
                    <!-- 第二組相片 (無縫循環) -->
                    <div class="flex gap-6 pr-6">
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322232.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322384.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322328.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322542.jpg?raw=true" alt="Img"></div>
                        <div class="portfolio-card"><img src="https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322590.jpg?raw=true" alt="Img"></div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 首頁底部按鈕區 -->
        <footer class="pb-16 pt-8 flex justify-center items-center">
            <button id="btn-show-gallery" class="group relative inline-flex items-center justify-center px-10 py-3.5 text-base font-medium tracking-widest text-gray-700 bg-transparent border border-gray-300 rounded-full overflow-hidden transition-all duration-500 hover:border-gray-800 hover:shadow-lg hover:shadow-gray-200/50">
                <span class="absolute inset-0 w-full h-full -mt-1 rounded-lg opacity-30 bg-gradient-to-b from-transparent via-transparent to-gray-200 pointer-events-none"></span>
                <span class="relative transition-colors duration-500 group-hover:text-gray-900">查看更多相片</span>
                <svg class="w-4 h-4 ml-2 relative transition-transform duration-500 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                </svg>
            </button>
        </footer>
    </div>

    <!-- 更多相片視圖 (網格) -->
    <div id="gallery-view" class="view-container view-hidden flex flex-col pt-16">
        <!-- 頂部導航與標題區 -->
        <header class="text-center px-4 relative z-10 mb-8">
            <!-- 返回按鈕 -->
            <button id="btn-back-home" class="absolute left-6 md:left-12 top-2 text-gray-400 hover:text-gray-800 transition-colors flex items-center text-sm tracking-widest">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"></path>
                </svg>
                返回
            </button>

            <h1 class="text-3xl md:text-4xl font-semibold tracking-[0.2em] text-gray-800 mb-2 ml-2 mt-10 md:mt-0">作品集 - 更多相片</h1>
            <p class="text-xs md:text-sm text-gray-400 font-light tracking-[0.3em] uppercase">Gallery Collection</p>
            
            <!-- 二級菜單 (相機分類) -->
            <nav class="flex flex-wrap justify-center gap-6 md:gap-16 mt-10 text-sm tracking-wider text-gray-400 px-4">
                <button class="tab-btn active transition-colors hover:text-gray-600" data-category="sony">由 Sony A6700 拍攝</button>
                <button class="tab-btn transition-colors hover:text-gray-600" data-category="nikon">由 Xiaomi 14 ultra 拍攝</button>
                <button class="tab-btn transition-colors hover:text-gray-600" data-category="canon">由 CCD 拍攝</button>
            </nav>
        </header>

        <!-- 主體內容區 (相片網格) -->
        <main class="flex-grow w-full max-w-6xl mx-auto px-6 pb-20">
            <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
                <!-- JavaScript 將動態載入帶有果凍回彈特效的相片卡片 -->
            </div>
        </main>
    </div>

    <script>
        // DOM 元素選取
        const homeView = document.getElementById('home-view');
        const galleryView = document.getElementById('gallery-view');
        const btnShowGallery = document.getElementById('btn-show-gallery');
        const btnBackHome = document.getElementById('btn-back-home');
        
        const gridContainer = document.getElementById('gallery-grid');
        const tabButtons = document.querySelectorAll('.tab-btn');

        // 模擬相機相片資料庫
        const galleryData = {
            sony: [
                "https://github.com/raychen283/image-/blob/main/a6700/DSC01227.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/a6700/DSC01207.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/a6700/DSC01210.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/a6700/DSC00378.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/a6700/DSC00389.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/a6700/DSC00391.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/a6700/DSC00402.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/a6700/DSC00539.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/a6700/DSC00701.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/a6700/DSC00748.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/a6700/DSC01200.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/a6700/DSC00881.jpg?raw=true"
            ],
            nikon: [
                "https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322186.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322232.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322294.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322328.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322384.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/%E5%B0%8F%E7%B1%B314u/1789983322627.jpg?raw=true"
            ],
            canon: [
                "https://github.com/raychen283/image-/blob/main/ccd/1789982959647.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/ccd/1789982959730.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/ccd/1789982959756.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/ccd/1789982959778.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/ccd/1789982959811.jpg?raw=true",
                "https://github.com/raychen283/image-/blob/main/ccd/1789982959838.JPG?raw=true"
            ]
        };

        // ====== 視圖切換邏輯 ======
        function switchView(hideEl, showEl) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // 替換 class 進行平滑過渡
            hideEl.classList.remove('view-active');
            hideEl.classList.add('view-hidden');
            
            showEl.classList.remove('view-hidden');
            showEl.classList.add('view-active');
        }

        // 綁定頁面跳轉按鈕
        btnShowGallery.addEventListener('click', () => {
            switchView(homeView, galleryView);
            // 切換過去時，如果尚未加載過相片，預設載入 Sony
            if (gridContainer.children.length === 0) {
                renderGallery('sony');
            }
        });

        btnBackHome.addEventListener('click', () => {
            switchView(galleryView, homeView);
        });

        // ====== 牆面翻轉相片渲染邏輯 ======
        function renderGallery(category) {
            // 清空當前網格內容以觸發新的動畫
            gridContainer.innerHTML = '';
            
            const images = galleryData[category];
            
            // 生成並插入帶有階層延遲動畫的相片卡片
            images.forEach((imgSrc, index) => {
                const card = document.createElement('div');
                card.className = 'photo-card flip-anim'; 
                
                // 設定 Staggered 延遲 (稍微拉長至 0.1 秒，產生如骨牌般的翻轉流暢感)
                const delay = index * 0.1; 
                card.style.animationDelay = `${delay}s`;

                const img = document.createElement('img');
                img.src = imgSrc;
                img.alt = `Photo by ${category}`;
                img.loading = 'lazy'; 

                card.appendChild(img);
                gridContainer.appendChild(card);
            });
        }

        // 綁定二級菜單標籤點擊事件
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                if(button.classList.contains('active')) return; // 已選中則不動作

                // 樣式切換
                tabButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                // 重新渲染該分類並播放動畫
                const category = button.getAttribute('data-category');
                renderGallery(category);
            });
        });

    </script>
</body>
</html>
